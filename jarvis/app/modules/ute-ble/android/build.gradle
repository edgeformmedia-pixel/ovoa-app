plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.uteble'
version = '1.0.0'

android {
  namespace "expo.modules.uteble"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // The UTE SDK itself, wired up as a Gradle project by gradleAarProjects in
  // expo-module.config.json (the SDK 52+ way to consume a local .aar).
  implementation project(":${project.name}\$ute-sdk")

  // The only two libraries the SDK's classes reference. None of the chip
  // vendor .aars in the demo are needed for scanning, pairing, or recordings.
  implementation 'com.google.code.gson:gson:2.10.1'
  implementation 'net.jpountz.lz4:lz4:1.3.0'
}
