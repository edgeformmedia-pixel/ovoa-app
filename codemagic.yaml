# Builds the OVOA iPhone app (jarvis/app, Expo) and uploads it to TestFlight.
# Needs an App Store Connect API key added in Codemagic under
# Personal Account settings > Integrations > Developer Portal, named "codemagic",
# and a secret CERTIFICATE_PRIVATE_KEY (an RSA key) in the app's "signing" variable group.
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      # Holds CERTIFICATE_PRIVATE_KEY, which signs the distribution certificate the build creates.
      groups:
        - signing
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events: []
    scripts:
      - name: Install dependencies
        working_directory: jarvis/app
        script: npm ci
      - name: Generate the iOS project
        working_directory: jarvis/app
        script: npx expo prebuild --platform ios --non-interactive
      - name: Set up code signing
        # Creates the App Store certificate and profile at Apple on the first run, reuses them after.
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.ovoa.app --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        working_directory: jarvis/app/ios
        # Codemagic's BUILD_NUMBER goes up by one every build, so TestFlight never sees a repeat.
        script: agvtool new-version -all $BUILD_NUMBER
      - name: Build the app
        working_directory: jarvis/app
        script: xcode-project build-ipa --workspace ios/OVOA.xcworkspace --scheme OVOA
    artifacts:
      - jarvis/app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
