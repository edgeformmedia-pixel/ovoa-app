# Builds the OVOA iPhone app (jarvis/app, Expo) and uploads it to TestFlight.
# Needs an App Store Connect API key added in Codemagic under
# Personal Account settings > Integrations > Developer Portal, named "codemagic",
# and a secret CERTIFICATE_PRIVATE_KEY (an RSA key) in the app's "signing" variable group.
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      # Holds CERTIFICATE_PRIVATE_KEY, which signs the distribution certificate the build creates.
      groups:
        - signing
      vars:
        # The precompiled Expo modules default to their debug build, which links
        # Apple's Testing.framework and crashes on launch outside Xcode.
        EXPO_USE_PRECOMPILED_MODULES: "0"
      node: 22
      xcode: latest
      cocoapods: default
    # Pushes to main build on their own — but only when something the app is
    # made of actually changed. A server-only commit reaches the phone through
    # a worker deploy, not a build, and an iOS build is ~25 minutes of the
    # monthly allowance to produce a byte-identical app.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    when:
      changeset:
        includes:
          - "jarvis/app"
          - "codemagic.yaml"
    scripts:
      - name: Install dependencies
        working_directory: jarvis/app
        script: npm ci
      - name: Generate the iOS project
        working_directory: jarvis/app
        script: npx expo prebuild --platform ios --non-interactive
      - name: Set up code signing
        # Creates the App Store certificate and profiles at Apple on the first run, reuses them after.
        # The Live Activity (Dynamic Island) widget is an app extension with its own bundle ID and profile.
        #
        # Sign in with Apple (expo-apple-authentication, app.json ios.usesAppleSignIn) puts the
        # com.apple.developer.applesignin entitlement in the app, so the App ID com.ovoa.app needs the
        # "Sign In with Apple" capability (API name APPLE_ID_AUTH) or no profile can sign it. The block
        # before fetch-signing-files turns it on once. When it's off and can't be turned on, the build
        # stops here instead of failing at the archive, the long part of the build; when the capabilities
        # can't be read it carries on, since it may well be on. Commands checked against
        # codemagic-cli-tools 0.69.0's --help:
        #   app-store-connect bundle-ids list --bundle-id-identifier ID --strict-match-identifier --platform IOS --json
        #   app-store-connect bundle-ids capabilities RESOURCE_ID --json
        #   app-store-connect bundle-ids enable-capabilities RESOURCE_ID --capability "Sign In with Apple"
        #   app-store-connect bundle-ids profiles --bundle-ids RESOURCE_ID --type IOS_APP_STORE --state ACTIVE --json
        #   app-store-connect profiles delete PROFILE_ID --ignore-not-found
        # A profile made before the capability doesn't carry the entitlement. Apple marks those INVALID
        # and fetch-signing-files only reuses ACTIVE ones, so --create makes a new one; any still ACTIVE
        # are deleted too, on the one build that turns the capability on. The enable call sends no
        # settings (the CLI has no flag for them), which nobody has seen Apple accept yet: ticking
        # "Sign In with Apple" on com.ovoa.app at developer.apple.com (Identifiers) before the first
        # build means it's never made, and this only prints "already on".
        script: |
          keychain initialize
          app-store-connect bundle-ids create com.ovoa.app.LiveActivity --name "OVOA LiveActivity" --platform IOS || echo "LiveActivity bundle ID already exists"
          APP_ID_RESOURCE=$(app-store-connect bundle-ids list --bundle-id-identifier com.ovoa.app \
            --strict-match-identifier --platform IOS --json \
            | python3 -c 'import sys, json; ids = json.load(sys.stdin); print(ids[0]["id"] if ids else "")') || APP_ID_RESOURCE=""
          CAPABILITIES=""
          if [ -n "$APP_ID_RESOURCE" ]; then
            CAPABILITIES=$(app-store-connect bundle-ids capabilities "$APP_ID_RESOURCE" --json) || CAPABILITIES=""
          fi
          # Read into a variable first: a pipe into grep -q can end the writer early, which
          # pipefail would count as a failure and read as "not on yet".
          if [ -z "$CAPABILITIES" ]; then
            echo "Couldn't read com.ovoa.app's capabilities; leaving Sign In with Apple as it is"
          elif grep -q '"APPLE_ID_AUTH"' <<< "$CAPABILITIES"; then
            echo "Sign In with Apple is already on for com.ovoa.app"
          elif app-store-connect bundle-ids enable-capabilities "$APP_ID_RESOURCE" --capability "Sign In with Apple"; then
            echo "Turned on Sign In with Apple for com.ovoa.app; replacing its App Store profiles"
            STALE=$(app-store-connect bundle-ids profiles --bundle-ids "$APP_ID_RESOURCE" --type IOS_APP_STORE --state ACTIVE --json \
              | python3 -c 'import sys, json; print(" ".join(p["id"] for p in json.load(sys.stdin)))') || STALE=""
            for PROFILE in $STALE; do
              app-store-connect profiles delete "$PROFILE" --ignore-not-found || echo "Couldn't delete profile $PROFILE"
            done
          else
            echo "Couldn't turn on Sign In with Apple: tick it on com.ovoa.app at developer.apple.com (Identifiers)"
            exit 1
          fi
          app-store-connect fetch-signing-files com.ovoa.app --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files com.ovoa.app.LiveActivity --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        working_directory: jarvis/app/ios
        # Codemagic's BUILD_NUMBER goes up by one every build, so TestFlight never sees a repeat.
        script: agvtool new-version -all $BUILD_NUMBER
      - name: Build the app
        working_directory: jarvis/app
        script: xcode-project build-ipa --workspace ios/OVOA.xcworkspace --scheme OVOA
      - name: Check no framework links test libraries
        # Testing.framework / XCTest don't exist on devices; linking them crashes the app at launch.
        script: |
          APP=$(find "$CM_BUILD_DIR/jarvis/app/build/ios/xcarchive" -maxdepth 4 -type d -name "*.app" | head -1)
          [ -n "$APP" ] || { echo "No .app found in the archive"; exit 1; }
          bad=0
          for bin in "$APP/$(basename "$APP" .app)" "$APP"/Frameworks/*.framework/*; do
            [ -f "$bin" ] && file "$bin" | grep -q Mach-O || continue
            if otool -L "$bin" | grep -E "Testing.framework|XCTest"; then
              echo "^ linked by $bin"
              bad=1
            fi
          done
          exit $bad
    artifacts:
      - jarvis/app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
